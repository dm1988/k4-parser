name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          sed -i 's/# DB_HOST=127.0.0.1/DB_HOST=mysql/' .env
          sed -i 's/# DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/# DB_DATABASE=laravel/DB_DATABASE=laravel/' .env
          sed -i 's/# DB_USERNAME=root/DB_USERNAME=sail/' .env
          sed -i 's/# DB_PASSWORD=/DB_PASSWORD=password/' .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code HEAD

      - name: Get runner group ID
        id: runner
        run: echo "group=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached Sail image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/8.4
          file: ./docker/8.4/Dockerfile
          load: true
          tags: sail-8.4/app
          build-args: |
            WWWGROUP=${{ steps.runner.outputs.group }}
          cache-from: type=gha,scope=sail-php84
          cache-to: type=gha,mode=max,scope=sail-php84

      - name: Start Sail
        run: vendor/bin/sail up -d --no-build

      - name: Generate application key
        run: vendor/bin/sail artisan key:generate

      - name: Run test suite
        run: vendor/bin/sail artisan test --compact

      - name: Stop Sail
        if: always()
        run: vendor/bin/sail down
