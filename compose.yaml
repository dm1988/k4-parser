services:
    laravel.test:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            LANG: C.UTF-8
            LC_ALL: C.UTF-8
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - crew-bid-secrets
        depends_on:
            - mysql
            - redis
            - crew-bid-secrets
    crew-bid-secrets:
        image: 'redis:alpine'
        command:
            - redis-server
            - --save
            - ''
            - --appendonly
            - 'no'
            - --dir
            - /tmp
            - --protected-mode
            - 'no'
            - --maxmemory
            - 32mb
            - --maxmemory-policy
            - noeviction
            - --slowlog-log-slower-than
            - '-1'
            - --slowlog-max-len
            - '0'
            - --aclfile
            - /etc/redis/crew-bid-secrets.acl
        read_only: true
        volumes:
            - './docker/crew-bid-secrets.acl:/etc/redis/crew-bid-secrets.acl:ro'
        tmpfs:
            - /tmp
        ulimits:
            core: 0
        networks:
            - crew-bid-secrets
        healthcheck:
            test: [CMD, redis-cli, ping]
            retries: 3
            timeout: 5s
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    crew-bid-secrets:
        internal: true
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
